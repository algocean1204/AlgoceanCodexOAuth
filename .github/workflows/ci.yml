name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Verify package build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install and verify import
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          python -c "from algocean_codex_oauth import AlgoceanCodexOAuth; print('import ok')"

      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build
